name: Build Android Widget APK
on:
  push:
    paths: ['android.zip', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: |
          unzip -o android.zip -d androidsrc
          cd androidsrc && gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../MyRoutine.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v${{ github.run_number }}
          name: My Routine Widget v${{ github.run_number }}
          body: Phone pe MyRoutine.apk download karke install karein, phir home screen pe widget add karein.
          files: MyRoutine.apk
