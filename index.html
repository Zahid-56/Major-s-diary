<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Major's Diary</title>
<meta name="description" content="Personal weekly routine — BSSE-5D classes, study, home workouts and shifts.">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--ink:#f4f1ea;--mut:#8d93a5;--gold:#e2c27d;--gold2:#b8893e;--ok:#7ee0b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(226,194,125,.13),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(90,110,180,.12),transparent 60%),var(--bg)}
.wrap{max-width:460px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.date{color:var(--mut);font-size:13px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:20px;display:block;line-height:1}.ring span{font-size:10px;color:var(--mut);letter-spacing:.08em}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:24px 0 18px}
.day{appearance:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);border-radius:14px;padding:10px 0 8px;font:600 12px Inter,sans-serif;cursor:pointer;position:relative;transition:.2s}
.day small{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.day.active{background:linear-gradient(160deg,var(--gold),var(--gold2));border-color:transparent;color:#2a1d05}.day.active small{color:#1a1204}
.day.today:not(.active)::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:9px;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.stat b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:10.5px;color:var(--mut);letter-spacing:.04em}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sec h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;margin:0}
.tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid rgba(226,194,125,.35);color:var(--gold)}
.tag.off{border-color:rgba(126,224,180,.35);color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);cursor:pointer;transition:background .2s,transform .1s;user-select:none}
.item:active{transform:scale(.985)}.item:hover{background:var(--s2)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a5168;display:grid;place-items:center;transition:.2s}
.chk svg{opacity:0;transform:scale(.5);transition:.2s}
.item.done .chk{background:linear-gradient(160deg,var(--gold),var(--gold2));border-color:transparent}.item.done .chk svg{opacity:1;transform:none}
.t{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.03em}
.n{font-weight:600;font-size:14.5px;margin-top:1px}.d{font-size:12.5px;color:var(--mut);margin-top:2px}
.item.done .n{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(226,194,125,.6)}
.note{margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(226,194,125,.10),rgba(226,194,125,.03));border:1px solid rgba(226,194,125,.2);font-size:13px;color:#e9dcc0}
.note b{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

.k-study .t{color:#9fbcff}.k-workout .t{color:#7ee0b4}.k-shift .t{color:#f2a3a3}.k-sleep .t{color:#b4a7f0}.k-life .t{color:var(--mut)}
.k-life{background:transparent;border-style:dashed}.k-workout .d{color:#b9c6c0}
.item.now{border-color:rgba(226,194,125,.55);box-shadow:0 0 0 3px rgba(226,194,125,.08),0 10px 30px rgba(0,0,0,.35)}
.t em{font-style:normal;margin-left:8px;padding:2px 7px;border-radius:99px;background:var(--gold);color:#1a1204;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px;font-size:11px;color:var(--mut)}.legend i{display:inline-block;width:7px;height:7px;border-radius:9px;margin-right:5px;vertical-align:1px}
footer{text-align:center;color:#5d6377;font-size:11.5px;margin-top:26px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">Major's Diary</div>
      <h1 id="title">Today</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="ring" aria-label="Progress">
      <svg width="86" height="86" viewBox="0 0 86 86"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca2"/><stop offset="1" stop-color="#b8893e"/></linearGradient></defs>
        <circle cx="43" cy="43" r="37" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="7"/>
        <circle id="arc" cx="43" cy="43" r="37" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="232.5"/></svg>
      <div class="v"><div><b id="pct">0%</b><span id="cnt">0/0</span></div></div>
    </div>
  </header>

  <nav class="days" id="days" aria-label="Choose day"></nav>

  <section class="stats">
    <div class="stat"><b id="sClasses">–</b><span>Classes</span></div>
    <div class="stat"><b id="sStudy">–</b><span>Study</span></div>
    <div class="stat"><b id="sWork">–</b><span>Workout</span></div>
    <div class="stat"><b id="sShift">–</b><span>Shift</span></div>
  </section>

  <div class="sec"><h2 id="dayName"></h2><span class="tag" id="tag"></span></div>
  <div class="list" id="list"></div>
  
  <div class="legend"><span><i style="background:#e2c27d"></i>Class</span><span><i style="background:#9fbcff"></i>Study</span><span><i style="background:#7ee0b4"></i>Workout</span><span><i style="background:#f2a3a3"></i>Shift</span><span><i style="background:#b4a7f0"></i>Sleep</span></div>
  <footer>Tap an item to mark it done · progress is saved on this device</footer>
</main>

<script>
const week = [{"name":"Monday","shift":false,"study":"1 hour","workout":"40 min","classes":5,"items":[{"t":"8:00 AM – 8:20 AM","s":480,"n":"Wake up & get ready","d":"Uni is next door — no rush","k":"life"},{"t":"8:30 AM – 9:30 AM","s":510,"n":"Web Engineering","d":"Muniba Bibi · A83-131","k":"class"},{"t":"9:30 AM – 10:30 AM","s":570,"n":"Data Structure & Algorithm","d":"Fawad Ali Shah · A83-010","k":"class"},{"t":"10:30 AM – 11:30 AM","s":630,"n":"Breakfast + DSA recap","d":"Free slot — eat, then 30 min recap","k":"life"},{"t":"11:30 AM – 1:30 PM","s":690,"n":"Operating System Lab","d":"Malik Ihtashim Asif · LAB A83-133","k":"class"},{"t":"1:30 PM – 2:30 PM","s":810,"n":"Computer Org. & Assembly","d":"Mehwish Malik · A82 Hall-217A","k":"class"},{"t":"2:30 PM – 3:30 PM","s":870,"n":"Design & Analysis of Algorithm","d":"Shahid Akbar · A83-223","k":"class"},{"t":"3:30 PM – 4:30 PM","s":930,"n":"Lunch + rest","d":"Recharge after a long class day","k":"life"},{"t":"5:00 PM – 6:00 PM","s":1020,"n":"Study · 1 hour","d":"Review today's lectures","k":"study"},{"t":"6:30 PM – 7:10 PM","s":1110,"n":"Workout · Upper body (home)","d":"Push-ups 4×12 · Pike push-ups 3×10 · Chair dips 3×12 · Plank 3×45s","k":"workout"},{"t":"8:00 PM – 8:30 PM","s":1200,"n":"Dinner","d":"","k":"life"},{"t":"9:00 PM – 10:00 PM","s":1260,"n":"Free time + prep for Tuesday","d":"Bag, notes, lab manual","k":"life"},{"t":"11:00 PM","s":1380,"n":"Sleep","d":"No shift tonight — full night's rest","k":"sleep"}]},{"name":"Tuesday","shift":true,"study":"1 hour","workout":"15 min","classes":3,"items":[{"t":"7:50 AM – 8:20 AM","s":470,"n":"Wake up & get ready","d":"","k":"life"},{"t":"8:30 AM – 11:30 AM","s":510,"n":"Data Structure & Algorithm Lab","d":"Fawad Ali Shah · LAB A83-016","k":"class"},{"t":"11:30 AM – 12:15 PM","s":690,"n":"Brunch","d":"","k":"life"},{"t":"12:15 PM – 1:15 PM","s":735,"n":"Study · 1 hour","d":"DSA lab follow-up","k":"study"},{"t":"1:30 PM – 2:30 PM","s":810,"n":"Computer Org. & Assembly","d":"Mehwish Malik · A83-130","k":"class"},{"t":"2:30 PM – 3:30 PM","s":870,"n":"Agile Software Development","d":"Sonia Rafaqat · A83-223","k":"class"},{"t":"3:45 PM – 5:00 PM","s":945,"n":"Nap","d":"Sleep bank before the night shift","k":"sleep"},{"t":"5:00 PM – 5:15 PM","s":1020,"n":"Mobility · 15 min","d":"Neck, shoulder & hip mobility · hamstring + back stretch","k":"workout"},{"t":"5:15 PM – 5:40 PM","s":1035,"n":"Meal","d":"Eat before the shift starts","k":"life"},{"t":"5:45 PM – 2:00 AM","s":1065,"n":"Work shift (from home)","d":"Work from home","k":"shift"},{"t":"2:15 AM","s":1575,"n":"Sleep","d":"","k":"sleep"}]},{"name":"Wednesday","shift":true,"study":"1 hour","workout":"Rest","classes":4,"items":[{"t":"9:00 AM – 9:25 AM","s":540,"n":"Wake up & breakfast","d":"","k":"life"},{"t":"9:30 AM – 10:30 AM","s":570,"n":"Operating System","d":"Malik Ihtashim Asif · A82 Hall-217A","k":"class"},{"t":"10:30 AM – 11:30 AM","s":630,"n":"Data Structure & Algorithm","d":"Fawad Ali Shah · A83-010","k":"class"},{"t":"11:30 AM – 12:15 PM","s":690,"n":"Lunch","d":"","k":"life"},{"t":"12:15 PM – 1:15 PM","s":735,"n":"Study · 1 hour","d":"Short and focused — recovery day","k":"study"},{"t":"1:30 PM – 2:30 PM","s":810,"n":"Design & Analysis of Algorithm","d":"Shahid Akbar · A83-131","k":"class"},{"t":"2:30 PM – 4:30 PM","s":870,"n":"Computer Org. & Assembly Lab","d":"Mehwish Malik · Hitech Lab-01","k":"class"},{"t":"4:35 PM – 5:20 PM","s":995,"n":"Power nap","d":"Rest day — no workout","k":"sleep"},{"t":"5:20 PM – 5:40 PM","s":1040,"n":"Meal","d":"","k":"life"},{"t":"5:45 PM – 2:00 AM","s":1065,"n":"Work shift (from home)","d":"Work from home","k":"shift"},{"t":"2:15 AM","s":1575,"n":"Sleep","d":"","k":"sleep"}]},{"name":"Thursday","shift":true,"study":"30 min","workout":"40 min","classes":4,"items":[{"t":"9:30 AM – 9:50 AM","s":570,"n":"Wake up & breakfast","d":"","k":"life"},{"t":"9:50 AM – 10:20 AM","s":590,"n":"Study · 30 min","d":"Quick review before class","k":"study"},{"t":"10:30 AM – 11:30 AM","s":630,"n":"Operating System","d":"Malik Ihtashim Asif · A83-130","k":"class"},{"t":"11:30 AM – 1:30 PM","s":690,"n":"Web Engineering Lab","d":"Muniba Bibi · LAB A83-005","k":"class"},{"t":"1:30 PM – 2:30 PM","s":810,"n":"Agile Software Development","d":"Sonia Rafaqat · A83-132","k":"class"},{"t":"2:30 PM – 3:30 PM","s":870,"n":"Design & Analysis of Algorithm","d":"Shahid Akbar · A83-132","k":"class"},{"t":"3:30 PM – 4:00 PM","s":930,"n":"Lunch","d":"","k":"life"},{"t":"4:15 PM – 4:55 PM","s":975,"n":"Workout · Lower body (home)","d":"Squats 4×20 · Lunges 3×12/leg · Glute bridges 3×15 · Wall sit 3×45s","k":"workout"},{"t":"5:00 PM – 5:40 PM","s":1020,"n":"Shower + meal","d":"","k":"life"},{"t":"5:45 PM – 2:00 AM","s":1065,"n":"Work shift (from home)","d":"Work from home","k":"shift"},{"t":"2:15 AM","s":1575,"n":"Sleep","d":"","k":"sleep"}]},{"name":"Friday","shift":true,"study":"1 hour","workout":"20 min","classes":3,"items":[{"t":"9:45 AM – 10:20 AM","s":585,"n":"Wake up & breakfast","d":"","k":"life"},{"t":"10:30 AM – 11:30 AM","s":630,"n":"Web Engineering","d":"Muniba Bibi · A83-223","k":"class"},{"t":"11:30 AM – 12:30 PM","s":690,"n":"Data Structure & Algorithm","d":"Fawad Ali Shah · A83-007","k":"class"},{"t":"12:30 PM – 1:30 PM","s":750,"n":"Lunch + break","d":"","k":"life"},{"t":"1:30 PM – 3:30 PM","s":810,"n":"Agile Software Development Lab","d":"Sonia Rafaqat · LAB A83-004","k":"class"},{"t":"3:30 PM – 4:30 PM","s":930,"n":"Study · 1 hour","d":"Week's notes + pending assignments","k":"study"},{"t":"4:35 PM – 4:55 PM","s":995,"n":"Workout · Core (home)","d":"Crunches 3×20 · Leg raises 3×12 · Mountain climbers 3×30s · Side plank 2×30s","k":"workout"},{"t":"5:00 PM – 5:40 PM","s":1020,"n":"Rest + meal","d":"","k":"life"},{"t":"5:45 PM – 2:00 AM","s":1065,"n":"Work shift (from home)","d":"Work from home","k":"shift"},{"t":"2:15 AM","s":1575,"n":"Sleep","d":"","k":"sleep"}]},{"name":"Saturday","shift":true,"study":"3 hours","workout":"45 min","classes":0,"items":[{"t":"10:00 AM – 10:30 AM","s":600,"n":"Wake up & breakfast","d":"","k":"life"},{"t":"11:00 AM – 1:50 PM","s":660,"n":"Deep study · 3 hours","d":"3 × 50 min blocks with 10 min breaks","k":"study"},{"t":"2:00 PM – 3:00 PM","s":840,"n":"Lunch","d":"","k":"life"},{"t":"3:00 PM – 4:00 PM","s":900,"n":"Errands / free time","d":"","k":"life"},{"t":"4:00 PM – 4:45 PM","s":960,"n":"Workout · Full body (home)","d":"4 rounds: 10 burpees · 15 push-ups · 20 squats · 30 jumping jacks · 40s plank","k":"workout"},{"t":"5:00 PM – 5:40 PM","s":1020,"n":"Shower + meal","d":"","k":"life"},{"t":"5:45 PM – 2:00 AM","s":1065,"n":"Work shift (from home)","d":"Work from home","k":"shift"},{"t":"2:15 AM","s":1575,"n":"Sleep","d":"","k":"sleep"}]},{"name":"Sunday","shift":false,"study":"3 hours","workout":"30 min","classes":0,"items":[{"t":"10:00 AM – 10:30 AM","s":600,"n":"Wake up & breakfast","d":"","k":"life"},{"t":"11:00 AM – 2:00 PM","s":660,"n":"Study · 3 hours","d":"Assignments + DSA practice","k":"study"},{"t":"2:00 PM – 3:00 PM","s":840,"n":"Lunch","d":"","k":"life"},{"t":"3:00 PM – 4:00 PM","s":900,"n":"Free time","d":"","k":"life"},{"t":"4:00 PM – 4:30 PM","s":960,"n":"Workout · HIIT (home)","d":"5 min warm-up · 20 min HIIT (40s on / 20s off) · 5 min stretch","k":"workout"},{"t":"5:00 PM – 6:00 PM","s":1020,"n":"Weekly review","d":"Plan the week, check deadlines","k":"study"},{"t":"8:00 PM – 8:30 PM","s":1200,"n":"Dinner","d":"","k":"life"},{"t":"10:30 PM","s":1350,"n":"Sleep","d":"Early night — 8:30 AM class tomorrow","k":"sleep"}]}];
const short = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const todayIdx = (new Date().getDay() + 6) % 7;
let sel = todayIdx;
const $ = id => document.getElementById(id);
const check = '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1a1204" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function dateOf(i){ const d = new Date(); d.setDate(d.getDate() + (i - todayIdx)); return d; }
function key(i){ const d = dateOf(i); return "md-" + d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function load(k){ try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch(e){ return []; } }
function save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function items(d){ return d.items; }
function nowMin(){ const n=new Date(); let m=n.getHours()*60+n.getMinutes(); return m<360?m+1440:m; }

short.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "day" + (i === todayIdx ? " today" : "");
  b.innerHTML = s + "<small>" + dateOf(i).getDate() + "</small>";
  b.onclick = () => { sel = i; render(); };
  $("days").appendChild(b);
});

function render(){
  const d = week[sel], list = items(d), k = key(sel), done = load(k);
  let cur = -1; if (sel === todayIdx) { const m = nowMin(); list.forEach((it, i) => { if (it.s <= m) cur = i; }); }
  document.querySelectorAll(".day").forEach((b, j) => b.classList.toggle("active", j === sel));
  $("title").textContent = sel === todayIdx ? "Today" : d.name;
  $("date").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" }).format(dateOf(sel));
  $("dayName").textContent = d.name;
  $("tag").textContent = d.shift ? "Shift day" : "No shift";
  $("tag").className = "tag" + (d.shift ? "" : " off");
  $("sClasses").textContent = d.classes;
  $("sStudy").textContent = d.study;
  $("sWork").textContent = d.workout;
  $("sShift").textContent = d.shift ? "5:45 PM" : "Off";
  $("tag").textContent = d.shift ? "Shift · from home" : "No shift";
    $("list").innerHTML = list.map((it, i) =>
    `<div class="item k-${it.k}${done.includes(i) ? " done" : ""}${i===cur ? " now" : ""}" data-i="${i}" role="checkbox" aria-checked="${done.includes(i)}" tabindex="0">
      <div class="chk">${check}</div>
      <div><div class="t">${it.t}${i===cur ? '<em>Now</em>' : ''}</div><div class="n">${it.n}</div>${it.d ? `<div class="d">${it.d}</div>` : ''}</div>
    </div>`).join("");
  document.querySelectorAll(".item").forEach(el => {
    const toggle = () => { const i = +el.dataset.i, cur = load(k), j = cur.indexOf(i); j < 0 ? cur.push(i) : cur.splice(j, 1); save(k, cur); render(); };
    el.onclick = toggle;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });
  const n = done.length, pct = Math.round(n / list.length * 100);
  $("pct").textContent = pct + "%";
  $("cnt").textContent = n + "/" + list.length + " DONE";
  $("arc").style.strokeDashoffset = 232.5 * (1 - n / list.length);
}
render();

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
</html>
