<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Weekly Routine</title>
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Your personal weekly class, study, workout and shift planner.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--panel:#121d30;--muted:#9eb0c9;--ink:#edf4ff;--accent:#70e1bd;--line:#263650}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#09111e,#15243a);font:15px system-ui;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:18px}
.widget{width:min(100%,430px);border:1px solid #2b3c56;border-radius:24px;background:#0f1929;box-shadow:0 20px 70px #0008;overflow:hidden}
.head{padding:18px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;background:linear-gradient(120deg,#162943,#102034)}
.brand{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.date{font-size:12px;color:var(--muted)}h1{font-size:21px;margin:4px 0 0}.toggle{border:1px solid #39536e;color:var(--ink);background:#20324b;border-radius:12px;padding:9px 12px;font-size:18px}
.summary{padding:15px 18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.metric{background:#152238;border:1px solid #233650;padding:10px;border-radius:14px}.metric b{display:block;font-size:17px}.metric span{font-size:11px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 14px 14px}.day{border:1px solid #2b3c54;background:#142136;color:#b9c7d9;border-radius:10px;padding:10px 0;font-weight:700}.day.active{background:var(--accent);border-color:var(--accent);color:#082018}
.detail{padding:0 18px 18px}.daytitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.daytitle h2{font-size:18px;margin:0}.pill{font-size:11px;color:#06251c;background:var(--accent);padding:5px 9px;border-radius:99px;font-weight:800}
.event{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.time{font-size:12px;color:var(--accent);font-weight:700;padding-top:2px}.event b{font-size:14px}.event small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}
.collapsed .detail,.collapsed .days,.collapsed .summary{display:none}.collapsed{width:min(100%,310px)}.collapsed .head{padding:14px}.collapsed h1{font-size:17px}.collapsed .brand{font-size:10px}.collapsed .toggle{font-size:15px}
.footer{padding:0 18px 18px;color:var(--muted);font-size:11px;line-height:1.5}.note{border:1px solid #6d5431;background:#2a2319;color:#f2d6a6;padding:10px 12px;border-radius:12px;margin-top:12px;font-size:12px}
.event{grid-template-columns:28px 76px 1fr;cursor:pointer}.chk{width:22px;height:22px;border:2px solid #39536e;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#082018;margin-top:1px}.event.done .chk{background:var(--accent);border-color:var(--accent)}.event.done b{text-decoration:line-through;opacity:.6}
.prog{height:6px;background:#1b2a41;border-radius:9px;overflow:hidden;margin-top:8px;width:160px}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}.collapsed .prog{width:120px}
@media(min-width:600px){body{padding:28px}}
</style>
</head>
<body>
<main class="widget" id="widget">
 <header class="head" id="expand" role="button" tabindex="0" aria-label="Expand or collapse weekly routine">
  <div><div class="brand">My weekly routine</div><h1 id="headline">Today's plan</h1><div class="date" id="date"></div><div class="prog"><i id="bar"></i></div><div class="date" id="progtxt"></div></div>
  <button class="toggle" id="toggle" aria-label="Expand widget">↗</button>
 </header>
 <section class="summary">
  <div class="metric"><b id="classes">—</b><span>Class blocks</span></div>
  <div class="metric"><b id="workout">—</b><span>Workout</span></div>
  <div class="metric"><b id="study">—</b><span>Study target</span></div>
 </section>
 <nav class="days" id="days" aria-label="Choose day"></nav>
 <section class="detail"><div class="daytitle"><h2 id="dayTitle"></h2><span class="pill" id="shiftPill"></span></div><div id="events"></div>
 <div class="note" id="note"></div></section>
 <div class="footer">Tap any item to tick it ✓ — progress saves on this phone and resets each day. Select a day to see its plan. The compact header opens/closes this widget. Day defaults to your device's current weekday.</div>
</main>
<script>
const week=[
{name:"Monday",classes:[["8:30–9:30","Web Engineering","A83-131 · Muniba Bibi"],["9:30–10:30","Data Structure & Algorithm","A83-010 · Fawad Ali Shah"],["11:30–1:30","Operating System Lab","LAB A83-133 · 2 hours"],["1:30–2:30","Computer Organization & Assembly","A82 Hall-217A"],["2:30–3:30","Design & Analysis of Algorithm","A83-223"]],workout:"40 min",study:"1 hour",notes:"Use the 10:30–11:30 gap for DSA recap. Travel + meal buffer before shift."},
{name:"Tuesday",classes:[["8:30–12:00","Data Structure & Algorithm Lab","LAB A83-016 · Fawad Ali Shah"],["1:30–2:30","Computer Organization & Assembly","A83-130"],["2:30–3:30","Agile Software Development Methods","A83-223"]],workout:"Rest",study:"Light / recovery",notes:"Protect recovery after Monday's night shift. Avoid workout if sleep-deprived; take a pre-shift nap if feasible."},
{name:"Wednesday",classes:[["9:30–10:30","Operating System","A82 Hall-217A"],["10:30–11:30","Data Structure & Algorithm","A83-010"],["1:30–2:30","Design & Analysis of Algorithm","A83-131"],["2:30–4:30","Computer Organization & Assembly Lab","Hitech Lab-01 · 2 hours"]],workout:"Rest",study:"1 hour (if rested)",notes:"Prioritize a recovery nap/sleep window and keep study focused, not lengthy."},
{name:"Thursday",classes:[["11:30–12:30","Operating System","A83-130"],["12:30–2:30","Web Engineering Lab","LAB A83-005 · 2 hours"],["2:30–3:30","Agile Software Development Methods","A83-132"],["3:30–4:30","Design & Analysis of Algorithm","A83-132"]],workout:"40 min",study:"1 hour",notes:"Workout only if sleep and energy are adequate. Prepare shift bag/meal before commute."},
{name:"Friday",classes:[["11:30–12:30","Web Engineering","A83-223"],["12:30–1:30","Data Structure & Algorithm","A83-007"],["2:30–4:30","Agile Software Development Methods Lab","LAB A83-004 · 2 hours"]],workout:"Optional walk",study:"1 hour",notes:"Use morning for recovery and one focused review block; keep commute buffer."},
{name:"Saturday",classes:[],workout:"60 min",study:"3 hours",notes:"Deep-work day: 3 × 50-minute study blocks with breaks. Workout and errands; shift 5:45 PM–2 AM."},
{name:"Sunday",classes:[],workout:"60 min",study:"3 hours",notes:"Weekly review, assignments + DSA practice. Plan meals, clothes and the coming week. No shift assumed."}
];
const dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let selected=(new Date().getDay()+6)%7;
const nav=document.getElementById("days");
week.forEach((d,i)=>{const b=document.createElement("button");b.className="day";b.textContent=dayNames[i];b.onclick=()=>render(i);b.id="day"+i;nav.appendChild(b)});
function render(i){selected=i;const d=week[i];document.querySelectorAll(".day").forEach((b,j)=>b.classList.toggle("active",i===j));
document.getElementById("headline").textContent=d.name+" plan";document.getElementById("date").textContent=new Intl.DateTimeFormat(undefined,{weekday:"long",month:"short",day:"numeric"}).format(new Date());
document.getElementById("dayTitle").textContent=d.name;document.getElementById("classes").textContent=d.classes.length;document.getElementById("workout").textContent=d.workout;document.getElementById("study").textContent=d.study;
document.getElementById("shiftPill").textContent=i===6?"NO SHIFT PLANNED":"SHIFT · 5:45 PM–2 AM";
let items=d.classes.map(e=>`<div class="event"><div class="chk"></div><div class="time">${e[0]}</div><div><b>${e[1]}</b><small>${e[2]}</small></div></div>`);
items.push(`<div class="event"><div class="chk"></div><div class="time">Daily</div><div><b>Work shift</b><small>${i===6?"Off (confirm if different)":"5:45 PM – 2:00 AM · Mon–Sat"}</small></div></div>`);
items.push(`<div class="event"><div class="chk"></div><div class="time">Target</div><div><b>Study · ${d.study}</b><small>Short focused blocks beat an unrealistic marathon.</small></div></div>`);
items.push(`<div class="event"><div class="chk"></div><div class="time">Health</div><div><b>Workout · ${d.workout}</b><small>Sleep and safe recovery come first.</small></div></div>`);
document.getElementById("events").innerHTML=items.join("");document.getElementById("note").textContent=d.notes;bindChecks()}
function key(){const t=new Date();const off=(selected-((t.getDay()+6)%7));t.setDate(t.getDate()+off);return "done-"+t.toISOString().slice(0,10)}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function bindChecks(){const k=key(),done=load(k);document.querySelectorAll("#events .event").forEach((el,n)=>{el.classList.toggle("done",done.includes(n));el.querySelector(".chk").textContent=done.includes(n)?"✓":"";el.onclick=()=>{const d=load(k);const j=d.indexOf(n);j<0?d.push(n):d.splice(j,1);save(k,d);bindChecks()}});progress()}
function progress(){const t=(new Date().getDay()+6)%7,tk="done-"+new Date().toISOString().slice(0,10);const total=week[t].classes.length+3,n=load(tk).length;document.getElementById("bar").style.width=Math.round(n/total*100)+"%";document.getElementById("progtxt").textContent=`Today: ${n}/${total} done`}
const widget=document.getElementById("widget");function toggle(){widget.classList.toggle("collapsed");document.getElementById("toggle").textContent=widget.classList.contains("collapsed")?"↗":"↙"}
document.getElementById("expand").addEventListener("click",e=>{if(e.target.closest("button"))return;toggle()});document.getElementById("expand").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
document.getElementById("toggle").onclick=toggle;
render(selected);
// Start compact like a mini-widget.
widget.classList.add("collapsed");document.getElementById("toggle").textContent="↗";
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
