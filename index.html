<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Major's Diary</title>
<meta name="description" content="Personal weekly routine — BSSE-5D classes, study, home workouts and shifts.">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--ink:#f4f1ea;--mut:#8d93a5;--gold:#e2c27d;--gold2:#b8893e;--ok:#7ee0b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(226,194,125,.13),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(90,110,180,.12),transparent 60%),var(--bg)}
.wrap{max-width:460px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.date{color:var(--mut);font-size:13px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:20px;display:block;line-height:1}.ring span{font-size:10px;color:var(--mut);letter-spacing:.08em}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:24px 0 18px}
.day{appearance:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);border-radius:14px;padding:10px 0 8px;font:600 12px Inter,sans-serif;cursor:pointer;position:relative;transition:.2s}
.day small{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.day.active{background:linear-gradient(160deg,var(--gold),var(--gold2));border-color:transparent;color:#2a1d05}.day.active small{color:#1a1204}
.day.today:not(.active)::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:9px;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.stat b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:10.5px;color:var(--mut);letter-spacing:.04em}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sec h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;margin:0}
.tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid rgba(226,194,125,.35);color:var(--gold)}
.tag.off{border-color:rgba(126,224,180,.35);color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);cursor:pointer;transition:background .2s,transform .1s;user-select:none}
.item:active{transform:scale(.985)}.item:hover{background:var(--s2)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a5168;display:grid;place-items:center;transition:.2s}
.chk svg{opacity:0;transform:scale(.5);transition:.2s}
.item.done .chk{background:linear-gradient(160deg,var(--gold),var(--gold2));border-color:transparent}.item.done .chk svg{opacity:1;transform:none}
.t{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.03em}
.n{font-weight:600;font-size:14.5px;margin-top:1px}.d{font-size:12.5px;color:var(--mut);margin-top:2px}
.item.done .n{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(226,194,125,.6)}
.note{margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(226,194,125,.10),rgba(226,194,125,.03));border:1px solid rgba(226,194,125,.2);font-size:13px;color:#e9dcc0}
.note b{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

.k-study .t{color:#9fbcff}.k-workout .t{color:#7ee0b4}.k-shift .t{color:#f2a3a3}.k-sleep .t{color:#b4a7f0}.k-life .t{color:var(--mut)}
.k-life{background:transparent;border-style:dashed}.k-workout .d{color:#b9c6c0}
.item.now{border-color:rgba(226,194,125,.55);box-shadow:0 0 0 3px rgba(226,194,125,.08),0 10px 30px rgba(0,0,0,.35)}
.t em{font-style:normal;margin-left:8px;padding:2px 7px;border-radius:99px;background:var(--gold);color:#1a1204;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px;font-size:11px;color:var(--mut)}.legend i{display:inline-block;width:7px;height:7px;border-radius:9px;margin-right:5px;vertical-align:1px}
.sec .acts{display:flex;gap:8px;align-items:center}
.edit-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--s2);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer}
.edit-btn svg{width:13px;height:13px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:18px;font-size:13.5px}
.sample{margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(226,194,125,.10),rgba(226,194,125,.03));border:1px solid rgba(226,194,125,.22);font-size:13px;color:#e9dcc0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
.btn.gold{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#1a1204}
.btn.ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#f2a3a3;border:1px solid rgba(242,163,163,.3)}
.sheet-bg{position:fixed;inset:0;background:rgba(3,4,8,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:10}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;background:#0e121c;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;z-index:11;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-h{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px}
.sheet-h small{display:block;color:var(--mut);font-size:12px}
.x{appearance:none;background:var(--s2);border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sheet-b{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.erow{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 1fr 34px;gap:8px}
.erow input,.erow select{width:100%;min-width:0;background:#151a27;border:1px solid #262d40;color:var(--ink);border-radius:10px;padding:9px 10px;font:500 13.5px Inter,sans-serif;color-scheme:dark}
.erow input:focus,.erow select:focus{outline:none;border-color:rgba(226,194,125,.6)}
.erow .full{grid-column:1/3}.erow .del{grid-row:1;grid-column:3;appearance:none;border:0;background:transparent;color:#f2a3a3;font-size:18px;cursor:pointer}
.erow label{font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.add{border:1px dashed rgba(226,194,125,.45);background:transparent;color:var(--gold)}
.copy{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.copy button{appearance:none;border:1px solid var(--line);background:var(--s1);color:var(--ink);border-radius:9px;padding:5px 9px;font:600 11.5px Inter,sans-serif;cursor:pointer}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-f .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:#1c2231;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:13px;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:#5d6377;font-size:11.5px;margin-top:26px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">Major's Diary</div>
      <h1 id="title">Today</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="ring" aria-label="Progress">
      <svg width="86" height="86" viewBox="0 0 86 86"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca2"/><stop offset="1" stop-color="#b8893e"/></linearGradient></defs>
        <circle cx="43" cy="43" r="37" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="7"/>

  <div class="sample" id="sample"><div>This is a sample routine. Make it yours — edit any day or start from scratch.</div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn gold" id="makeMine">Edit</button><button class="btn ghost" id="blank">Start blank</button></div></div>
  <div class="legend"><span><i style="background:#e2c27d"></i>Class</span><span><i style="background:#9fbcff"></i>Study</span><span><i style="background:#7ee0b4"></i>Workout</span><span><i style="background:#f2a3a3"></i>Shift</span><span><i style="background:#b4a7f0"></i>Sleep</span></div>
  <footer>Tap an item to mark it done · everything is saved on this device</footer>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="sheet-h"><div><h3 id="edTitle">Edit</h3><small>Add, change or remove items for this day</small></div><button class="x" id="closeEd" aria-label="Close">×</button></div>
  <div class="sheet-b">
    <div id="rows"></div>
    <button class="btn add" id="addRow">+ Add item</button>
    <div class="copy" id="copyDays"></div>
  </div>
  <div class="sheet-f">
    <button class="btn danger" id="resetAll">Reset to sample</button>
    <button class="btn ghost" id="clearDay">Clear day</button>
    <span class="sp"></span>
    <button class="btn gold" id="saveEd">Save</button>
  </div>
</section>
<div class="toast" id="toast"></div>

leep","d":"Early night — 8:30 AM class tomorrow","k":"sleep"}]}];

/* ---------- storage ---------- */
function get(k, f){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch(e){ return f; } }
function put(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let custom = get(ROUTINE_KEY, null);
let week = custom || SAMPLE;

function syncNative(){
  try { if (window.MajorsDiary) window.MajorsDiary.saveRoutine(custom ? JSON.stringify(custom) : ""); } catch(e){}
}
function saveWeek(w){
  custom = w; week = w || SAMPLE; put(ROUTINE_KEY, w); syncNative();
}

/* ---------- time helpers ---------- */
function fmt(m){ const h = Math.floor(m / 60) % 24, mm = m % 60; return (h % 12 || 12) + ":" + String(mm).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM"); }
function range(it){ return it.e != null ? fmt(it.s) + " – " + fmt(it.e) : fmt(it.s); }
function toInput(m){ const h = Math.floor(m / 60) % 24; return String(h).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function fromInput(v){ if (!v) return null; const [h, m] = v.split(":").map(Number); return h * 60 + m; }
function dur(m){ if (!m) return null; if (m < 60) return m + " min"; const h = m / 60; return (Number.isInteger(h) ? h : h.toFixed(1)) + (h === 1 ? " hour" : " hours"); }
function nowMin(){ const n = new Date(); const m = n.getHours() * 60 + n.getMinutes(); return m < 360 ? m + 1440 : m; }

function dateOf(i){ const d = new Date(); d.setDate(d.getDate() + (i - todayIdx)); return d; }
function doneKey(i){ const d = dateOf(i); return "md-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

/* ---------- main view ---------- */
short.forEach((s, i) => {

  b.innerHTML = s + "<small>" + dateOf(i).getDate() + "</small>";
  b.onclick = () => { sel = i; render(); };
  $("days").appendChild(b);
});

function render(){
  const day = week[sel] || { items: [] }, list = day.items, k = doneKey(sel), done = get(k, []);
  let cur = -1;
  if (sel === todayIdx) { const m = nowMin(); list.forEach((it, i) => { if (it.s <= m) cur = i; }); }
  document.querySelectorAll(".day").forEach((b, j) => b.classList.toggle("active", j === sel));
  $("title").textContent = sel === todayIdx ? "Today" : NAMES[sel];
  $("date").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" }).format(dateOf(sel));
  $("dayName").textContent = NAMES[sel];

  const sum = t => list.filter(i => i.k === t && i.e != null).reduce((a, i) => a + (i.e - i.s), 0);
  const shift = list.find(i => i.k === "shift");
  $("sClasses").textContent = list.filter(i => i.k === "class").length;
  $("sStudy").textContent = dur(sum("study")) || "–";
  $("sWork").textContent = dur(sum("workout")) || "Rest";
  $("sShift").textContent = shift ? fmt(shift.s) : "Off";
  $("tag").textContent = shift ? "Shift day" : "No shift";
  $("tag").className = "tag" + (shift ? "" : " off");

  $("list").innerHTML = list.length ? list.map((it, i) =>
    `<div class="item k-${esc(it.k)}${done.includes(i) ? " done" : ""}${i === cur ? " now" : ""}" data-i="${i}" role="checkbox" aria-checked="${done.includes(i)}" tabindex="0">
      <div class="chk">${check}</div>
      <div><div class="t">${range(it)}${i === cur ? "<em>Now</em>" : ""}</div><div class="n">${esc(it.n)}</div>${it.d ? `<div class="d">${esc(it.d)}</div>` : ""}</div>
    </div>`).join("")
    : `<div class="empty">Nothing planned for ${NAMES[sel]} yet.<br><br><button class="btn gold" onclick="openEditor()">+ Add your first item</button></div>`;

  document.querySelectorAll(".item").forEach(el => {
    const toggle = () => { const i = +el.dataset.i, c = get(k, []), j = c.indexOf(i); j < 0 ? c.push(i) : c.splice(j, 1); put(k, c); render(); };
    el.onclick = toggle;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });

  const n = done.filter(i => i < list.length).length, total = list.length || 1;
  $("pct").textContent = Math.round(n / total * 100) + "%";
  $("cnt").textContent = n + "/" + list.length + " DONE";
  $("arc").style.strokeDashoffset = 232.5 * (1 - n / total);
  $("sample").style.display = custom ? "none" : "flex";
}

/* ---------- editor ---------- */
let draft = [];
function openEditor(){
  draft = JSON.parse(JSON.stringify((week[sel] || { items: [] }).items));
  $("edTitle").textContent = "Edit " + NAMES[sel];
  $("copyDays").innerHTML = "Copy to: " + short.map((s, i) => i === sel ? "" : `<button data-c="${i}">${s}</button>`).join("");
  $("copyDays").querySelectorAll("button").forEach(b => b.onclick = () => copyTo(+b.dataset.c));
  drawRows();
  $("sheetBg").classList.add("open"); $("sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeEditor(){
  $("sheetBg").classList.remove("open"); $("sheet").classList.remove("open");
  document.body.style.overflow = "";
}
function drawRows(){
  $("rows").innerHTML = draft.map((it, i) => `
    <div class="erow" data-i="${i}">
      <div><label>Start</label><input type="time" data-f="s" value="${toInput(it.s)}"></div>
      <div><label>End</label><input type="time" data-f="e" value="${it.e != null ? toInput(it.e) : ""}"></div>
      <div class="full"><select data-f="k">${TYPES.map(([v, l]) => `<option value="${v}"${v === it.k ? " selected" : ""}>${l}</option>`).join("")}</select></div>
      <button class="del" data-del="${i}" aria-label="Remove">✕</button>
      <div class="full"><input data-f="n" placeholder="What? e.g. Web Engineering" value="${esc(it.n)}"></div>
      <div class="full"><input data-f="d" placeholder="Details (optional) e.g. Room A83-131" value="${esc(it.d)}"></div>
    </div>`).join("") || `<div class="empty">No items. Tap “Add item” to start.</div>`;
  $("rows").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { readRows(); draft.splice(+b.dataset.del, 1); drawRows(); });
}
function readRows(){
  draft = [...$("rows").querySelectorAll(".erow")].map(r => {
    const v = f => r.querySelector(`[data-f="${f}"]`).value;
    let s = fromInput(v("s")) ?? 480, e = fromInput(v("e"));
    if (s < 300) s += 1440;               // after midnight (e.g. 2:15 AM) belongs to the night
    if (e != null) while (e <= s) e += 1440;
    return { s, e, n: v("n").trim(), d: v("d").trim(), k: v("k") };
  });
}
function addRow(){
  readRows();
  const last = draft[draft.length - 1];
  const s = last && last.e != null && last.e < 1440 ? last.e : 720;
  draft.push({ s, e: s + 60, n: "", d: "", k: "class" });
  drawRows();
  const rows = $("rows").querySelectorAll('[data-f="n"]'); rows[rows.length - 1]?.focus();
}
function currentWeek(){ return JSON.parse(JSON.stringify(custom || SAMPLE)); }
function commit(items, dayIdx){
  const w = currentWeek();
  w[dayIdx].items = items.filter(i => i.n).sort((a, b) => a.s - b.s);
  put(doneKey(dayIdx), null);
  saveWeek(w);
}
function saveEditor(){
  readRows();
  if (draft.some(i => !i.n)) { if (!confirm("Items without a name will be removed. Continue?")) return; }
  commit(draft, sel); closeEditor(); render(); toast("Saved ✓");
}
function copyTo(i){
  readRows(); commit(draft, sel); commit(draft, i); render(); toast("Copied to " + NAMES[i]);
}
function clearDay(){ draft = []; drawRows(); }
function startBlank(){
  if (!confirm("Start a blank routine? The sample schedule will be removed from this device.")) return;
  saveWeek(NAMES.map(name => ({ name, items: [] }))); render(); openEditor();
}
function resetSample(){
  if (!confirm("Reset to the sample routine? Your own routine will be removed.")) return;
  saveWeek(null); closeEditor(); render(); toast("Sample routine restored");
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }

$("editBtn").onclick = openEditor;
$("sheetBg").onclick = closeEditor;
$("closeEd").onclick = closeEditor;
$("addRow").onclick = addRow;
$("saveEd").onclick = saveEditor;
$("clearDay").onclick = clearDay;
$("resetAll").onclick = resetSample;
$("makeMine").onclick = openEditor;
$("blank").onclick = startBlank;

render();
syncNative();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
</html>
